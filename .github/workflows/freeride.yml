name: freeride
on:
  schedule:
    - cron: "0 5 * * *"    # 06:00/07:00 Belgische tijd
    - cron: "0 15 * * *"   # 16:00/17:00 Belgische tijd
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prognose en melding
        run: mkdir -p docs && python freeride.py --out docs/index.html --state state.json ${{ github.event_name == 'workflow_dispatch' && '--always' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_URL: ${{ vars.REPORT_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Rapport en status bewaren
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet || (git commit -m "Prognose bijgewerkt" && git push)
